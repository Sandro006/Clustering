# ============================================================
#  Configuration HAProxy - Test de clustering (2 serveurs Spring)
# ============================================================

global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    retries 3
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms

# ------------------------------------------------------------
# FRONTEND : point d'entrée pour les clients
# ------------------------------------------------------------
frontend http_front
    bind *:8083
    default_backend servers_back

# ------------------------------------------------------------
# BACKEND : les deux instances Spring Boot
# ------------------------------------------------------------
backend servers_back
    balance roundrobin

    # (optionnel) maintenir la session d'un utilisateur sur le meme serveur
    # cookie SERVERID insert indirect nocache
    # server server1 127.0.0.1:8081 check cookie s1
    # server server2 127.0.0.1:8082 check cookie s2

    # WSL2 en mode NAT : host.docker.internal atteint les services Windows (hote)
    server server1 host.docker.internal:8081 check
    server server2 host.docker.internal:8082 check

# ------------------------------------------------------------
# PAGE DE STATISTIQUES (optionnelle)
# ------------------------------------------------------------
listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s
